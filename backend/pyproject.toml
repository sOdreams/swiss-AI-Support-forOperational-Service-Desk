[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-desk-retrieval"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "faiss-cpu==1.13.2",
  "numpy>=1.26,<3",
  "sentence-transformers==5.4.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
service-desk-build-index = "service_desk.retrieval.build:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
